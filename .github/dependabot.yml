version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependabot
  - package-ecosystem: pub
    directories:
      - /
      - /example
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependabot
  - package-ecosystem: gradle
    directories:
      - /android
      - /example/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependabot
  - package-ecosystem: bundler
    directories:
      - /example
      - /example/ios
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependabot
  # NOT included — swift: ios/rokt_sdk/Package.swift path-depends on the
  # FlutterFramework package that the Flutter tool generates, so it cannot be
  # resolved outside a Flutter build. The example has no Podfile.
