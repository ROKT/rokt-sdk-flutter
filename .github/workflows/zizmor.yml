name: Zizmor Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {} # deny-by-default; job below grants only what it needs

jobs:
  zizmor:
    name: Scan GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # zizmor resolves reusable workflow/action metadata via GitHub API
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # zizmor only needs the tree at HEAD
      # A finding fails this job. The zizmor version is pinned so a new release of the tool
      # cannot fail main on its own; bump it together with the fixes its new audits ask for.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false # no SARIF upload; findings show as annotations instead
          annotations: true # inline PR annotations (GitHub caps at 10/run)
          version: 1.30.1
