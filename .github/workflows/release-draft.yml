name: Release – Draft

on:
  workflow_dispatch: # checkov:skip=CKV_GHA_7
    inputs:
      bump-type:
        description: Specify if the version should be bumped as major, minor, patch
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Builds and checks the release files without the release App's credentials. The job that
  # opens the pull request copies these files and runs none of this job's tools.
  prepare-release:
    # Drafts start from main only, since the release environment also admits tags matching v*;
    # open-release-pr is skipped with this job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # generate-changelog reads merged pull request titles
    outputs:
      new-version: ${{ steps.bump-version.outputs.new_version }}
      release-notes: ${{ steps.changelog.outputs.release-notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get current version
        id: version-file
        run: |
          version_from_file=$(head -n 1 VERSION)
          echo "release-version=$version_from_file" >> $GITHUB_OUTPUT
      - name: Bump version
        id: bump-version
        uses: actions-ecosystem/action-bump-semver@34e334551143a5301f38c830e44a22273c6ff5c5 # v1.0.0
        with:
          current_version: ${{ steps.version-file.outputs.release-version }}
          level: ${{ github.event.inputs.bump-type || 'patch' }}
      - name: Save validated version to file
        env:
          NEW_VERSION: ${{ steps.bump-version.outputs.new_version }}
        run: |
          printf '%s\n' "$NEW_VERSION" > VERSION
      - name: Generate changelog from merged PR titles
        id: changelog
        uses: ROKT/rokt-workflows/actions/generate-changelog@da0c5fd5d38e9cf113a24ec9aaea079cc7d0bc40 # main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: ${{ steps.bump-version.outputs.new_version }}
          tag-prefix: v
          changelog-path: CHANGELOG.md

      - name: Update pubspec.yaml
        env:
          NEW_VERSION: ${{ steps.bump-version.outputs.new_version }}
        run: |
          sed -i "s|^version: .*|version: ${NEW_VERSION}|" pubspec.yaml

      - name: Update ios/rokt_sdk.podspec
        env:
          NEW_VERSION: ${{ steps.bump-version.outputs.new_version }}
        run: |
          sed -i -E "s|^([[:space:]]*s\.version[[:space:]]*=[[:space:]]*).*|\1'${NEW_VERSION}'|" ios/rokt_sdk.podspec
          grep -n "s.version" ios/rokt_sdk.podspec

      # No cache in release jobs; see Environments in RELEASING.md.
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable

      - name: Run dry-run publish
        run: |
          flutter pub publish --dry-run

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            VERSION
            pubspec.yaml
            CHANGELOG.md
            ios/rokt_sdk.podspec
          if-no-files-found: error
          retention-days: 1

  open-release-pr:
    needs: prepare-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files

      # Take only the four release files, as regular files, so nothing else from the artifact
      # reaches the checkout before the App token exists.
      - name: Apply release files
        env:
          NEW_VERSION: ${{ needs.prepare-release.outputs.new-version }}
          RELEASE_FILES: ${{ runner.temp }}/release-files
        run: |
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The bumped version is not a semantic version"
            exit 1
          fi
          for file in VERSION pubspec.yaml CHANGELOG.md ios/rokt_sdk.podspec; do
            if [ ! -f "$RELEASE_FILES/$file" ] || [ -L "$RELEASE_FILES/$file" ]; then
              echo "::error::Release file $file is missing or not a regular file"
              exit 1
            fi
            cp "$RELEASE_FILES/$file" "$file"
          done

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SDK_RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            rokt-sdk-flutter
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          add-paths: |
            VERSION
            pubspec.yaml
            CHANGELOG.md
            ios/rokt_sdk.podspec
          commit-message: "Prepare release ${{ needs.prepare-release.outputs.new-version }}"
          branch: release/${{ needs.prepare-release.outputs.new-version }}
          title: "Prepare release ${{ needs.prepare-release.outputs.new-version }}"
          base: main
          body: |
            Preparing for release ${{ needs.prepare-release.outputs.new-version }}
            - Updated pubspec.yaml to new version
            - Updated ios/rokt_sdk.podspec to new version
            - Updated CHANGELOG.md
            - Updated VERSION file
            - Ran a dry-run publish

            ## Changelog
            ${{ needs.prepare-release.outputs.release-notes }}
          labels: |
            release
