name: Release – Publish

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify-tag-on-main:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm the tagged commit is on main
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: .github/scripts/verify-tag-on-main.sh "$TAG_NAME"

  build-test-ios:
    name: Build & Test iOS
    needs: verify-tag-on-main
    permissions:
      contents: read
    uses: $/.github/workflows/test-ios.yml
    with:
      flutter-version: ${{ vars.FLUTTER_VERSION }}
      ruby-version: ${{ vars.RUBY_VERSION }}
      xcode-version: "26.3"

  build-test-android:
    name: Build & Test Android
    needs: verify-tag-on-main
    permissions:
      contents: read
    uses: $/.github/workflows/test-android.yml
    with:
      flutter-version: ${{ vars.FLUTTER_VERSION }}

  publish-and-release:
    needs: [verify-tag-on-main, build-test-ios, build-test-android]
    runs-on: ubuntu-latest
    environment: pub-dev
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Publish Package
        run: flutter pub publish --force

      - uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
        id: extract-release-notes
        with:
          changelog_file: CHANGELOG.md
          release_notes_file: ${{ github.ref_name }}.md
      - name: Print release notes (debug)
        env:
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES"
      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: release-notes
          path: ${{ github.ref_name }}.md

      - name: Create Github release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          printf '## Release notes:\n%s\n' "$RELEASE_NOTES" > release-body.md
          gh release create "$TAG_NAME" --verify-tag --latest --title "$TAG_NAME" --notes-file release-body.md

  upload-release-notes:
    needs: [publish-and-release]
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SDK_RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            rokt-docs
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ROKT/rokt-docs
          token: ${{ steps.generate-token.outputs.token }}
          ref: main
          persist-credentials: false

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ github.ref_name }}.md

      - name: Move release notes to docs
        env:
          FINAL_VERSION: ${{ github.ref_name }}
        run: |
          mv "${FINAL_VERSION}.md" "changelogs/flutter/${FINAL_VERSION}.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: Update Flutter SDK Release Notes
          branch: update-flutter-sdk-release-notes-${{ github.ref_name }}
          title: NOJIRA - Update Flutter SDK Release Notes
          base: main
          body: |
            # Update Flutter SDK Release Notes

            Flutter SDK version ${{ github.ref_name }} has been released.

            Please review and merge the PR to update the release notes.
          labels: |
            chore
