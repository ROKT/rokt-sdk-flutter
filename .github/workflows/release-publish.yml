name: Release – Publish

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build-test-ios:
    name: Build & Test iOS
    uses: ./.github/workflows/test-ios.yml
    with:
      flutter-version: ${{ vars.FLUTTER_VERSION }}
      ruby-version: ${{ vars.RUBY_VERSION }}
      xcode-version: "26.3"

  build-test-android:
    name: Build & Test Android
    uses: ./.github/workflows/test-android.yml
    with:
      flutter-version: ${{ vars.FLUTTER_VERSION }}

  publish-and-release:
    needs: [build-test-ios, build-test-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #2.23.0
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Publish Package
        run: flutter pub publish --force

      - uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
        id: extract-release-notes
        with:
          changelog_file: CHANGELOG.md
          release_notes_file: ${{ github.ref_name }}.md
      - name: Print release notes (debug)
        env:
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES"
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: release-notes
          path: ${{ github.ref_name }}.md

      - name: Create Github release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          makeLatest: true
          tag: ${{ github.ref_name }}
          body: |
            ## Release notes:
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-release-notes:
    needs: [publish-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SDK_RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            rokt-docs

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ROKT/rokt-docs
          token: ${{ steps.generate-token.outputs.token }}
          ref: main
          persist-credentials: false

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ github.ref_name }}.md

      - name: Move release notes to docs
        env:
          FINAL_VERSION: ${{ github.ref_name }}
        run: |
          mv "${FINAL_VERSION}.md" "changelogs/flutter/${FINAL_VERSION}.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: Update Flutter SDK Release Notes
          branch: update-flutter-sdk-release-notes-${{ github.ref_name }}
          title: NOJIRA - Update Flutter SDK Release Notes
          base: main
          body: |
            # Update Flutter SDK Release Notes

            Flutter SDK version ${{ github.ref_name }} has been released.

            Please review and merge the PR to update the release notes.
          labels: |
            chore
